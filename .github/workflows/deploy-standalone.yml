name: Build Runtime Branch

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Prepare runtime bundle
        run: |
          rm -rf release
          mkdir -p release/.next
          if [ -d ".next/standalone" ]; then
            STANDALONE_DIR=".next/standalone"
          elif [ -d ".next/build/standalone" ]; then
            STANDALONE_DIR=".next/build/standalone"
          else
            echo "Standalone output not found. Checked .next/standalone and .next/build/standalone"
            ls -la .next || true
            ls -la .next/build || true
            exit 1
          fi

          if [ -d ".next/static" ]; then
            STATIC_DIR=".next/static"
          elif [ -d ".next/build/static" ]; then
            STATIC_DIR=".next/build/static"
          else
            echo "Static output not found. Checked .next/static and .next/build/static"
            ls -la .next || true
            ls -la .next/build || true
            exit 1
          fi

          cp -r "${STANDALONE_DIR}/"* release/
          cp -r "${STATIC_DIR}" release/.next/static
          cp -r public release/public

      - name: Publish runtime branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: runtime
          publish_dir: ./release
          force_orphan: true
          enable_jekyll: false
